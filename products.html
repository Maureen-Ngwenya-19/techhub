
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - TechVibe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="nav-container">

            <h2 class="logo">TechVibe</h2>

            <ul class="nav-menu">

                <li><a href="index.html">Home</a></li>

                <li><a href="products.html">Products</a></li>

                <li><a href="contact.html">Contact</a></li>

                <li>
                    <a href="cart.html" class="cart-link">
                        Cart (<span id="cart-count">0</span>)
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- Main Products Section -->
    <main class="main-content">

        <div class="container">

            <h1 class="page-title">Our Products</h1>


            <!-- Search Box -->
            <div class="search-box">
                <input type="search" id="search-input"
                       placeholder="Search products..."
                       aria-label="Search products">
            </div>


            <!-- Filter Buttons -->
            <div class="filters">

                <button class="filter-btn active" data-category="all">
                    All Products
                </button>

                <button class="filter-btn" data-category="phones">
                    Phones
                </button>

                <button class="filter-btn" data-category="laptops">
                    Laptops
                </button>

                <button class="filter-btn" data-category="accessories">
                    Accessories
                </button>

            </div>


            <!-- Products Grid -->
            <div class="products-grid" id="products-grid">

                <!-- JavaScript will display products here -->

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>&copy; 2026 TechVibe. All rights reserved.</p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
