
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - TechVibe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="nav-container">

            <h2 class="logo">TechVibe</h2>

            <ul class="nav-menu">

                <li><a href="index.html">Home</a></li>

                <li><a href="products.html">Products</a></li>

                <li><a href="contact.html">Contact</a></li>

                <li>
                    <a href="cart.html" class="cart-link">
                        Cart (<span id="cart-count">0</span>)
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- Main Shopping Cart Section -->
    <main class="main-content">

        <div class="container">

            <h1 class="page-title">Shopping Cart</h1>

            <div class="cart-layout">

                <!-- Cart Items -->
                <div class="cart-items" id="cart-items">

                    <!-- JavaScript will display cart items here -->

                </div>


                <!-- Order Summary -->
                <div class="cart-summary">

                    <div class="summary-card">

                        <h3>Order Summary</h3>

                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="cart-subtotal">R0.00</span>
                        </div>

                        <div class="summary-row">
                            <span>Shipping:</span>
                            <span id="cart-shipping">R100.00</span>
                        </div>

                        <div class="summary-row">
                            <span>VAT (15%):</span>
                            <span id="cart-tax">R0.00</span>
                        </div>

                        <div class="summary-row total-row">
                            <span>Total:</span>
                            <span id="cart-total">R0.00</span>
                        </div>

                        <button
                            class="btn btn-primary full-width"
                            onclick="goToCheckout()">

                            Proceed to Checkout

                        </button>

                        <a href="products.html"
                           class="btn btn-secondary full-width">

                            Continue Shopping

                        </a>

                    </div>

                </div>

            </div>


            <!-- Empty Cart Message -->
            <div id="empty-cart" class="empty-cart" style="display: none;">

                <h2>Your cart is empty</h2>

                <p>
                    Looks like you haven't added anything yet.
                </p>

                <a href="products.html" class="btn btn-primary">
                    Start Shopping
                </a>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>&copy; 2026 TechVibe. All rights reserved.</p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
